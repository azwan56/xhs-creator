name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 安装依赖并打包静态资源
      - name: Install dependencies and build
        run: |
          npm ci || npm install
          npm run build
        env:
          VITE_VOLC_API_KEY: ${{ secrets.VOLC_API_KEY }}
          VITE_DOUBAO_ENDPOINT_ID: ${{ secrets.DOUBAO_ENDPOINT_ID }}

      # 4. 安装 sshpass 部署工具
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      # 5. 使用 SSH Password + Rsync 部署到阿里云 ECS
      - name: Deploy to ECS via Rsync with sshpass
        run: |
          echo "🚀 正在通过密码认证同步静态文件到阿里云 ECS..."
          export SSHPASS="${{ secrets.ECS_PASSWORD }}"
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            dist/ ${{ secrets.ECS_USER || 'root' }}@${{ secrets.ECS_HOST }}:${{ secrets.ECS_TARGET_DIR || '/var/www/vanpower' }}
          echo "✅ 同步部署成功！"
