name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 安装依赖并打包静态资源
      - name: Install dependencies and build
        run: |
          npm ci || npm install
          npm run build
        env:
          VITE_VOLC_API_KEY: ${{ secrets.VOLC_API_KEY }}
          VITE_DOUBAO_ENDPOINT_ID: ${{ secrets.DOUBAO_ENDPOINT_ID }}

      # 4. 使用 SCP 增量部署到阿里云 ECS (同时兼容密钥与密码认证)
      - name: Deploy to ECS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER || 'root' }}
          password: ${{ secrets.ECS_PASSWORD || '' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || '' }}
          source: "dist/*"
          target: ${{ secrets.ECS_TARGET_DIR || '/var/www/vanpower' }}
          strip_components: 1
          overwrite: true
